name: Tests

on:
  push:
    branches:
      - main
      - fix/anon-reliability-20261122
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anon_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated baseline schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
      - name: Apply album and retention migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_album_copy.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_album_insert_guard.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_retention_indexes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_update_leases.sql
      - name: Verify migrations are safely repeatable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_album_copy.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_album_insert_guard.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_retention_indexes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/20261122_anon_update_leases.sql
      - name: Verify album routing, claims, mappings, late-part guard, and indexes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/album_migrations_test.sql
      - name: Verify concurrent claim and late insert serialization
        run: bash tests/sql/album_concurrency_test.sh
